<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 342" preserveAspectRatio="none">
<!--
  What is behind the old door, as much as a doorway shows of it: a wall, a
  lantern hung in front of it, a shelf of books and a board floor. It is
  the room the door leads to, drawn small and from the threshold.

  chronicle.css stands it behind the leaf, the same size as the opening,
  so the leaf's own numbers are this drawing's. The bars are at x=51 to 93
  and y=65 to 117, and what lies inside that box is all a reader sees of
  the room while the door is shut: the lantern, and the heads of a few
  books. So those are placed for the bars and everything else for the
  half second the door stands open.

  The lantern is the only light, and it is to the right of the middle. A
  book's right side is the lit one.
-->
<defs>
<!-- the lantern's light on the wall -->
<radialGradient id="g" gradientUnits="userSpaceOnUse" cx="87" cy="72" r="168"><stop offset="0" stop-color="#f6cb80"/><stop offset=".13" stop-color="#d59a4b"/><stop offset=".36" stop-color="#84592a"/><stop offset=".66" stop-color="#3a2613"/><stop offset="1" stop-color="#150e08"/></radialGradient>
<!-- the glare round the flame -->
<radialGradient id="h" gradientUnits="userSpaceOnUse" cx="87" cy="71" r="26"><stop offset="0" stop-color="#fff4cf" stop-opacity=".95"/><stop offset=".3" stop-color="#ffdc94" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
<!-- the floor, lit nearest the wall and dark at the threshold -->
<linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3d1d"/><stop offset=".5" stop-color="#2e1e0f"/><stop offset="1" stop-color="#120c07"/></linearGradient>
<!-- shadow falling down -->
<linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0704" stop-opacity=".7"/><stop offset="1" stop-color="#0b0704" stop-opacity="0"/></linearGradient>
</defs>

<!-- the wall -->
<rect width="144" height="342" fill="url(#g)"/>

<!-- the floor: its boards run away from the door, towards a point at the lantern's height -->
<rect y="262" width="144" height="80" fill="url(#f)"/>
<path fill="none" stroke="#0b0704" stroke-opacity=".55" stroke-width=".7" d="M-22 342L46 262M20 342L59 262M62 342L72 262M104 342L85 262M146 342L98 262M188 342L111 262M-64 342L33 262M230 342L124 262"/>
<path fill="none" stroke="#0b0704" stroke-opacity=".8" stroke-width="1" d="M0 262h144"/>
<path fill="none" stroke="#f6cb80" stroke-opacity=".2" stroke-width=".6" d="M0 263h144"/>

<!-- the shelf: the board, the light along its top, and the shade it drops on the wall -->
<rect y="123" width="144" height="13" fill="url(#d)"/>
<rect y="118" width="144" height="5" fill="#1d130b"/>
<path fill="none" stroke="#f6cb80" stroke-opacity=".5" stroke-width=".7" d="M0 118.4h144"/>

<!-- the books on it: dark against the lit wall, each with a little light down its right side -->
<g fill="#1c120a">
<rect x="4" y="86" width="9" height="32"/><rect x="14" y="80" width="11" height="38"/><rect x="26" y="89" width="8" height="29"/>
<rect x="35" y="83" width="10" height="35"/><rect x="46" y="78" width="12" height="40"/><rect x="59" y="87" width="8" height="31"/>
<path d="M69.5 118L75.6 86.6L82.4 87.9L77.2 118z"/>
<rect x="102" y="84" width="10" height="34"/><rect x="113" y="90" width="8" height="28"/><rect x="122" y="81" width="11" height="37"/><rect x="134" y="88" width="8" height="30"/>
</g>
<path fill="none" stroke="#f6cb80" stroke-opacity=".34" stroke-width=".6" d="M12.6 86.6V118M24.6 80.6V118M33.6 89.6V118M44.6 83.6V118M57.6 78.6V118M66.6 87.6V118M82 88.4L76.9 118M102.4 84.6V118M113.4 90.6V118M122.4 81.6V118M134.4 88.6V118"/>
<path fill="none" stroke="#f6cb80" stroke-opacity=".22" stroke-width=".5" d="M4 86.3h9M14 80.3h11M26 89.3h8M35 83.3h10M46 78.3h12M59 87.3h8M102 84.3h10M113 90.3h8M122 81.3h11M134 88.3h8"/>
<!-- the bands on their spines -->
<path fill="none" stroke="#0b0704" stroke-opacity=".7" stroke-width=".6" d="M14 88h11M14 110h11M35 91h10M35 111h10M46 86h12M46 92h12M46 110h12M102 92h10M102 110h10M122 89h11M122 111h11"/>

<!-- the lantern: the wire it hangs by, the glare, the cap, the glass and the flame in it, the base -->
<path fill="none" stroke="#0b0704" stroke-opacity=".8" stroke-width=".6" d="M87 0V56"/>
<circle cx="87" cy="71" r="26" fill="url(#h)"/>
<path fill="none" stroke="#130c06" stroke-width=".7" d="M82.4 63a4.7 4.7 0 0 1 9.2 0"/>
<path fill="#130c06" d="M83.2 62.4h7.6l1.4 3.4h-10.4z"/>
<rect x="82.6" y="65.8" width="8.8" height="11.6" rx="1.6" fill="#ffe7a6"/>
<path fill="#fffaea" d="M87 67.6c1.9 2.4 2.2 4.4 1.4 6-.5 1-2.3 1-2.8 0-.8-1.6-.5-3.6 1.4-6z"/>
<path fill="none" stroke="#130c06" stroke-opacity=".7" stroke-width=".5" d="M84.8 65.8v11.6M89.2 65.8v11.6"/>
<path fill="#130c06" d="M81.6 77.4h10.8l-.8 4.2h-9.2z"/>
</svg>
