# Add inside the existing <VirtualHost> for frontendneeded.com.
# Requires mod_proxy and mod_proxy_http (already loaded for /api/chat).
#
# These lines reverse-proxy the preside-by-side API endpoints on the
# public site to the local Python service listening on 127.0.0.1:8787.
#
#   /api/suggest             POST — submit a new bar suggestion
#   /api/rate                POST — cast/update a severity rating (1–10)
#   /api/ratings/<president> GET  — aggregate {bar_id: {avg,count}}
#
# The /api/ratings route is regex-mapped via ProxyPassMatch so the
# <president> path segment is forwarded as-is. Server-side validation
# restricts it to [A-Za-z]{1,40}; this proxy line only needs to forward
# the URL faithfully.
ProxyPass        /api/suggest http://127.0.0.1:8787/suggest
ProxyPassReverse /api/suggest http://127.0.0.1:8787/suggest
ProxyPass        /api/rate    http://127.0.0.1:8787/rate
ProxyPassReverse /api/rate    http://127.0.0.1:8787/rate
ProxyPassMatch   ^/api/ratings/(.*)$ http://127.0.0.1:8787/ratings/$1
ProxyPassReverse /api/ratings/       http://127.0.0.1:8787/ratings/

# Prevent Apache from serving the server-side source as static files.
<Directory "/var/www/frontendneeded.com/preside-by-side/server">
    Require all denied
</Directory>
