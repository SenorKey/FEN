# Apache changes for the Hire Me assistant, in the frontendneeded.com
# <VirtualHost *:443> file (frontendneeded.com-le-ssl.conf).
#
# 1. REPLACE the existing /api/chat block, which sends visitors straight to
#    Ollama:
#
#        <Location /api/chat>
#            ProxyPass http://127.0.0.1:11434/api/chat
#            ProxyPassReverse http://127.0.0.1:11434/api/chat
#            Require all granted
#        </Location>
#
#    with this, which sends them to chat.py instead. flushpackets=on passes
#    each piece of the answer on as it comes; timeout=180 outlasts the
#    longest answer.

    <Proxy http://127.0.0.1:8792/*>
        Require all granted
    </Proxy>
    <Location /api/chat>
        ProxyPass http://127.0.0.1:8792/chat flushpackets=on timeout=180
        ProxyPassReverse http://127.0.0.1:8792/chat
        Require all granted
    </Location>

# 2. ADD, next to the other server/ blocks near the end of the file, so the
#    service's source and prompt are never served as pages:

<Directory "/var/www/frontendneeded.com/hire-me/server">
    Require all denied
</Directory>

# The old <Proxy http://127.0.0.1:11434/*> block can stay; with nothing
# proxied to that port it does nothing.
#
# To undo: put the old two ProxyPass lines back and reload Apache. The page
# would then talk to Ollama directly again, but without its prompt, so roll
# hire-me/ back to the commit before this change as well.
