# Add inside the existing <VirtualHost *:443> for frontendneeded.com, next to
# the Preside by Side /api lines. Needs mod_proxy and mod_proxy_http, which
# are already loaded for /api/chat and /api/suggest.
#
# Everything under /api/todo-tensor/ goes to the ToDo Tensor service:
#   GET  /api/todo-tensor/list      the list (public)
#   GET  /api/todo-tensor/session   signed in or not
#   POST /api/todo-tensor/login     owner sign-in
#   POST /api/todo-tensor/logout
#   PUT  /api/todo-tensor/list      save (owner only)

<Proxy http://127.0.0.1:8791/*>
    Require all granted
</Proxy>

<Location /api/todo-tensor/>
    ProxyPass http://127.0.0.1:8791/
    ProxyPassReverse http://127.0.0.1:8791/
    Require all granted
</Location>

# The web root is the repo, so keep the service's own folder from being
# served as files (its source, and any stray database).
<Directory "/var/www/frontendneeded.com/todo-tensor/server">
    Require all denied
</Directory>
