<body class="tt">

  <main id="main-content" class="tt-space">

    <!-- The scene: one canvas draws every rank. The list in the panel is the
         same ideas in words, so what the canvas shows is never the only copy. -->
    <section id="tt-scene" class="tt-scene">
      <canvas id="tt-canvas" class="tt-canvas" role="img" aria-label="Ideas drawn as nodes. The same ideas are listed in the panel."></canvas>
      <noscript>
        <p class="tt-noscript">ToDo Tensor needs JavaScript to draw the ideas. The list itself is published as
          <a href="/todo-tensor/list.json">list.json</a>.</p>
      </noscript>

      <div class="tt-hud tt-hud-left">
        <span class="tt-rank-word" id="tt-rank-word">Rank</span>
        <div class="tt-ranks" role="radiogroup" aria-label="Rank">
          <button type="button" class="tt-rank-btn" data-rank="0" role="radio" aria-checked="true">0</button>
          <button type="button" class="tt-rank-btn" data-rank="1" role="radio" aria-checked="false">1</button>
          <button type="button" class="tt-rank-btn" data-rank="2" role="radio" aria-checked="false">2</button>
          <button type="button" class="tt-rank-btn" data-rank="3" role="radio" aria-checked="false">3</button>
        </div>
      </div>

      <div class="tt-hud tt-hud-right">
        <div id="tt-faces" class="tt-faces" role="group" aria-label="Look straight at a face" hidden>
          <button type="button" class="tt-face" data-face="xy">xy</button>
          <button type="button" class="tt-face" data-face="xz">xz</button>
          <button type="button" class="tt-face" data-face="yz">yz</button>
        </div>
        <button type="button" id="tt-panel-toggle" class="tt-hud-btn" aria-expanded="false" aria-controls="tt-panel">List</button>
      </div>

      <div id="tt-tray" class="tt-tray" hidden>
        <p id="tt-tray-label" class="tt-tray-label"></p>
        <div id="tt-tray-nodes" class="tt-tray-nodes"></div>
      </div>

      <div id="tt-card" class="tt-card" hidden></div>

      <h1 class="tt-mark">ToDo Tensor</h1>
    </section>

    <aside id="tt-panel" class="tt-panel" aria-label="Parameters and ideas">
      <div class="tt-panel-scroll">

        <section id="tt-params" class="tt-params" aria-label="Parameters">
          <div id="tt-param-rows"></div>
          <p id="tt-params-note" class="tt-params-note" hidden></p>
          <button type="button" id="tt-param-add" class="tt-quiet tt-param-add">Add a parameter</button>
        </section>

        <form id="tt-add" class="tt-add" autocomplete="off">
          <label for="tt-new" class="tt-sr">New idea</label>
          <input id="tt-new" class="tt-new" type="text" maxlength="300" placeholder="Add an idea, then press Enter"
            enterkeyhint="done">
          <button type="submit" class="tt-add-btn" aria-label="Add idea">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />
            </svg>
          </button>
        </form>

        <p id="tt-count" class="tt-count"></p>
        <ul id="tt-list" class="tt-list" aria-label="Ideas"></ul>
        <p id="tt-empty" class="tt-empty" hidden>Nothing out here yet. Add the first idea above.</p>

        <footer class="tt-foot">
          <p id="tt-status" class="tt-status">Your changes are saved in this browser only.</p>
          <div class="tt-foot-actions">
            <button id="tt-copy" class="tt-quiet" type="button">Copy as JSON</button>
            <button id="tt-link" class="tt-quiet" type="button">Copy link to this arrangement</button>
            <button id="tt-reset" class="tt-quiet" type="button">Reset to published list</button>
          </div>
        </footer>

      </div>
    </aside>

    <div id="tt-toast" class="tt-toast" hidden>
      <span id="tt-toast-msg"></span>
      <button id="tt-undo" class="tt-undo" type="button">Undo</button>
    </div>
    <div id="tt-live" class="tt-sr" aria-live="polite"></div>
  </main>
</body>

</html>
