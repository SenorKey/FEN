# Add inside the existing <VirtualHost *:443> for frontendneeded.com,
# near the /api/suggest block. Requires mod_proxy + mod_proxy_http
# (already loaded for /api/chat and /api/suggest).
#
# ONLY the beacon intake is proxied publicly. The dashboard itself
# (GET / on :8788) is deliberately NOT exposed — view it over the LAN,
# an ssh tunnel, or RustDesk on the server's own desktop.
ProxyPass        /api/event http://127.0.0.1:8788/event
ProxyPassReverse /api/event http://127.0.0.1:8788/event

# Prevent Apache from serving the station source/dashboard as static files.
<Directory "/var/www/frontendneeded.com/status-station">
    Require all denied
</Directory>
