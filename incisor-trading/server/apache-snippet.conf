# Add inside the existing <VirtualHost> for frontendneeded.com.
# Requires mod_proxy and mod_proxy_http, already loaded for the other services.
#
# Reverse-proxies the Incisor Trading API to the local service on
# 127.0.0.1:8789. This file grows a line per route as they land, so only what
# exists is ever exposed.
#
# /health is deliberately NOT proxied. It is a local diagnostic — reach it
# with `curl http://127.0.0.1:8789/health` on the box. There is no reason for
# the public internet to be able to ask this service how it is feeling.

# The read routes. quote and history take ?symbol=TICKER and are GET-only; the
# service whitelists the symbol at the edge, so nothing here needs to.
ProxyPass        /api/incisor/quote http://127.0.0.1:8789/quote
ProxyPassReverse /api/incisor/quote http://127.0.0.1:8789/quote

ProxyPass        /api/incisor/history http://127.0.0.1:8789/history
ProxyPassReverse /api/incisor/history http://127.0.0.1:8789/history

# The name table the search box reads. Local to the service — it answers from
# a committed table and never goes upstream — but it is still a route the
# browser calls, and a route the browser calls that is missing from this file
# is a feature that works everywhere except in production.
ProxyPass        /api/incisor/symbols http://127.0.0.1:8789/symbols
ProxyPassReverse /api/incisor/symbols http://127.0.0.1:8789/symbols

# The sector grid. Takes no arguments and answers for a fixed set of eleven
# funds, so there is nothing here for a caller to vary.
ProxyPass        /api/incisor/sectors http://127.0.0.1:8789/sectors
ProxyPassReverse /api/incisor/sectors http://127.0.0.1:8789/sectors

# A company's filings. Takes ?symbol=TICKER like the price routes, and is the
# one route backed by SEC EDGAR rather than by the quote provider — which is
# invisible from out here, and deliberately so: a caller asks the service, and
# the service decides which upstream answers.
ProxyPass        /api/incisor/fundamentals http://127.0.0.1:8789/fundamentals
ProxyPassReverse /api/incisor/fundamentals http://127.0.0.1:8789/fundamentals

# Never serve the source, the notes or the development checks as static files.
<Directory "/var/www/frontendneeded.com/incisor-trading/server">
    Require all denied
</Directory>

<Directory "/var/www/frontendneeded.com/incisor-trading/docs">
    Require all denied
</Directory>

<Directory "/var/www/frontendneeded.com/incisor-trading/tests">
    Require all denied
</Directory>
