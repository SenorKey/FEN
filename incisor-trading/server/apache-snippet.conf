# Add inside the existing <VirtualHost> for frontendneeded.com.
# Requires mod_proxy and mod_proxy_http, already loaded for the other services.
#
# Reverse-proxies the Incisor Trading API to the local service on
# 127.0.0.1:8789. Data routes arrive with T3 and T4; this file grows a line
# per route as they land, so only what exists is ever exposed.
#
# /health is deliberately NOT proxied. It is a local diagnostic — reach it
# with `curl http://127.0.0.1:8789/health` on the box. There is no reason for
# the public internet to be able to ask this service how it is feeling.

# ProxyPass        /api/incisor/quote http://127.0.0.1:8789/quote   (T3)
# ProxyPassReverse /api/incisor/quote http://127.0.0.1:8789/quote   (T3)

# Never serve the source, the notes or the development checks as static files.
<Directory "/var/www/frontendneeded.com/incisor-trading/server">
    Require all denied
</Directory>

<Directory "/var/www/frontendneeded.com/incisor-trading/docs">
    Require all denied
</Directory>

<Directory "/var/www/frontendneeded.com/incisor-trading/tests">
    Require all denied
</Directory>
