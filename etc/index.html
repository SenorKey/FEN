<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Black Hole</title>
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <style>
        html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        canvas { display: block; }
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-family: monospace;
            font-size: 14px;
            z-index: 10;
        }
        #credits {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.45);
            font-family: monospace;
            font-size: 11px;
            text-align: center;
            line-height: 1.6;
            z-index: 10;
            pointer-events: auto;
        }
        #credits a {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.3);
        }
        #credits a:hover {
            color: rgba(255, 255, 255, 0.9);
            border-bottom-color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <div id="loader">Loading...</div>

    <div id="credits">
        Based on <a href="https://github.com/oseiskar/black-hole" target="_blank" rel="noopener">three.js Black Hole</a> by Otto Seiskari (MIT) &middot;
        Skymap: <a href="https://www.eso.org/public/images/eso0932a/" target="_blank" rel="noopener">ESO/S.&nbsp;Brunier</a>
        (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC&nbsp;BY&nbsp;4.0</a>)
    </div>

    <!-- Vertex shader: covers the full screen with one quad. -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        void main() {
            gl_Position = vec4(position, 1.0);
        }
    </script>

    <!--
        Fragment shader: runs once per pixel, ray-traces light through curved
        spacetime, samples the skymap textures wherever the bent ray ends up.
        Mustache template syntax has been pre-resolved with these settings:
            quality = medium (NSTEPS = 100)
            accretion_disk = false
            planet = disabled
            observer motion = false
            all relativistic effects = false
        Bump NSTEPS to 200 for 'high' quality (slower) or 40 for 'fast' (uglier).
    -->
    <script id="fragment-shader" type="x-shader/x-fragment">
        #define M_PI 3.141592653589793238462643383279
        #define DEG_TO_RAD (M_PI/180.0)
        #define ROT_Y(a) mat3(0, cos(a), sin(a), 1, 0, 0, 0, sin(a), -cos(a))

        // Spectrum texture lookup: the spectra.png image is a lookup table
        // mapping (temperature) -> (color emitted by a black body at that temp).
        const float BLACK_BODY_TEXTURE_COORD = 1.0;
        const float SPECTRUM_TEX_TEMPERATURE_RANGE = 65504.0;
        #define BLACK_BODY_COLOR(t) texture2D(spectrum_texture, \
            vec2((t) / SPECTRUM_TEX_TEMPERATURE_RANGE, BLACK_BODY_TEXTURE_COORD))

        uniform vec2 resolution;
        uniform vec3 cam_pos;
        uniform vec3 cam_x;
        uniform vec3 cam_y;
        uniform vec3 cam_z;
        uniform sampler2D galaxy_texture, star_texture, spectrum_texture;

        // ODE integration parameters.
        const int NSTEPS = 100;
        const float MAX_REVOLUTIONS = 2.0;

        const float STAR_MIN_TEMPERATURE = 4000.0;
        const float STAR_MAX_TEMPERATURE = 15000.0;
        const float STAR_BRIGHTNESS = 1.0;
        const float GALAXY_BRIGHTNESS = 0.4;

        // Rotates the skymap so the Milky Way band sits at a nice angle.
        // Change 45.0 to taste, or set to 0.0 to align with the equator.
        mat3 BG_COORDS = ROT_Y(45.0 * DEG_TO_RAD);

        const float FOV_ANGLE_DEG = 90.0;
        float FOV_MULT = 1.0 / tan(DEG_TO_RAD * FOV_ANGLE_DEG * 0.5);

        // Maps a 3D direction onto 2D texture coordinates (equirectangular).
        vec2 sphere_map(vec3 p) {
            return vec2(atan(p.x, p.y) / M_PI * 0.5 + 0.5,
                        asin(p.z) / M_PI + 0.5);
        }

        void main() {
            // Convert pixel coordinates to clip-space [-1, 1], correct aspect.
            vec2 p = -1.0 + 2.0 * gl_FragCoord.xy / resolution.xy;
            p.y *= resolution.y / resolution.x;

            // Initial ray: from observer position, through this pixel.
            vec3 pos = cam_pos;
            vec3 ray = normalize(p.x * cam_x + p.y * cam_y + FOV_MULT * cam_z);

            vec4 color = vec4(0.0, 0.0, 0.0, 1.0);

            // Schwarzschild geodesic state in (u = 1/r, du/d-phi) form.
            float u = 1.0 / length(pos);
            float u0 = u;

            vec3 normal_vec = normalize(pos);
            vec3 tangent_vec = normalize(cross(cross(normal_vec, ray), normal_vec));

            float du = -dot(ray, normal_vec) / dot(ray, tangent_vec) * u;
            float du0 = du;

            float phi = 0.0;
            float step;
            vec3 old_pos = pos;

            // Integrate the bent light path step-by-step.
            for (int j = 0; j < NSTEPS; j++) {
                step = MAX_REVOLUTIONS * 2.0 * M_PI / float(NSTEPS);

                // Adaptive step size near sharp curvature.
                float max_rel_u_change = (1.0 - log(u)) * 10.0 / float(NSTEPS);
                if ((du > 0.0 || (du0 < 0.0 && u0/u < 5.0)) &&
                    abs(du) > abs(max_rel_u_change * u) / step) {
                    step = max_rel_u_change * u / abs(du);
                }

                // Leapfrog integration of the geodesic equation.
                u += du * step;
                float ddu = -u * (1.0 - 1.5 * u * u);
                du += ddu * step;

                if (u < 0.0) break;

                phi += step;
                old_pos = pos;
                pos = (cos(phi) * normal_vec + sin(phi) * tangent_vec) / u;

                if (u > 1.0) break;  // ray fell into the event horizon
            }

            // u < 1.0 means the ray escaped past the event horizon.
            // Sample the skymap at the direction the ray ended up traveling.
            if (u < 1.0) {
                ray = normalize(pos - old_pos);
                vec2 tex_coord = sphere_map(ray * BG_COORDS);

                // stars.png encodes star presence in red and color (temp) in green.
                vec4 star_color = texture2D(star_texture, tex_coord);
                if (star_color.r > 0.0) {
                    float t_coord = STAR_MIN_TEMPERATURE +
                        (STAR_MAX_TEMPERATURE - STAR_MIN_TEMPERATURE) * star_color.g;
                    color += BLACK_BODY_COLOR(t_coord) * star_color.r * STAR_BRIGHTNESS;
                }

                color += texture2D(galaxy_texture, tex_coord) * GALAXY_BRIGHTNESS;
            }
            // else: ray was swallowed -> color stays black.

            gl_FragColor = color;
        }
    </script>

    <script src="js-libs/three.min.js"></script>
    <script src="js-libs/OrbitControls.js"></script>
    <script src="main.js"></script>
</body>
</html>
